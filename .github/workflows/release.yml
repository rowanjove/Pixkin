name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $Version = (python -c "from core.version import VERSION; print(VERSION)").Trim()
          if ("v$Version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match application version v$Version"
          }

      - name: Run release tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/generate_version_info.py --check
          python -m pytest -q

      - name: Build release artifacts
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_release.ps1

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: pixkin-release-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
